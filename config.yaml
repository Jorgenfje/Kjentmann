# Kjentmann configuration
area:
  name: askim
  center_lat: 59.583
  center_lon: 11.162
  size_km: 20          # side length of the square map area

imagery:
  collection: sentinel-2-l2a
  stac_url: https://earth-search.aws.element84.com/v1
  date_from: "2025-06-01"
  date_to: "2025-08-31"
  max_cloud_cover: 5     # percent, whole scene
  min_valid_fraction: 0.99  # reject scenes with no-data inside the area

tiles:
  size_px: 256         # 256 px x 10 m = 2.56 km per tile
  overlap: 0.5         # 50 % overlap between neighbouring tiles

paths:
  data_dir: data

query:
  # Test images come from a different date than the map, so light,
  # vegetation and shadows differ. The map scene itself is excluded.
  date_from: "2025-04-15"
  date_to: "2025-10-15"
  count: 200
  seed: 42

model:
  name: vit_small_patch14_dinov2.lvd142m   # timm model id
  image_size: 224
  batch_size: 32
  top_k: 5

refine:
  matcher: lightglue    # lightglue (DISK + LightGlue) or sift (OpenCV, no download)
  window_scale: 1.5     # map window = 1.5 x tile, so images that straddle tiles fit
  upscale: 2            # enlarge 10 m pixels 2x before detecting keypoints
  max_keypoints: 2048
  ransac_px: 3.0        # max reprojection error for an inlier, in pixels
  min_inliers: 15       # fewer agreeing matches -> answer "unknown"
  min_scale: 0.7        # reject transforms with implausible scale
  max_scale: 1.4
  # Coarse search tries each test image at these rotations and zooms and keeps
  # each tile's best similarity (DINOv2 is sensitive to rotation and scale).
  tta_rotations: [-15, 0, 15]
  tta_zooms: [0.85, 1.0, 1.2]
  # If no candidate reaches min_inliers, match again with the image rotated.
  fine_rotations: [-15, 15]

navigate:
  # v0.4: search only inside an uncertainty circle around the inertial estimate.
  radii_km: [2, 5, 10]   # evaluated in one run
  window_scale: 2.0      # windows 2 x tile at a stride of 1 tile
  early_stop_inliers: 40 # stop searching once a window is this confident
  map_radius_km: 5       # which radius gets a results map

# Test-image profiles. 'easy' = plain crops (same sensor, north-up, same scale).
# 'realistic' adds what a camera under an aircraft would see: some heading
# error, unknown altitude (scale), blur and sensor noise.
query_profiles:
  easy:
    rotation_deg: 0
    scale_min: 1.0
    scale_max: 1.0
    blur_sigma: 0
    noise_std: 0
  realistic:
    rotation_deg: 15      # random heading error, +/- degrees
    scale_min: 0.8        # altitude 20 % lower ...
    scale_max: 1.25       # ... to 25 % higher than assumed
    blur_sigma: 1.0       # pixels
    noise_std: 6          # grey levels
  # Diagnosis: one factor at a time (kjentmann diagnose)
  blur:
    rotation_deg: 0
    scale_min: 1.0
    scale_max: 1.0
    blur_sigma: 1.0
    noise_std: 6
  rotation:
    rotation_deg: 15
    scale_min: 1.0
    scale_max: 1.0
    blur_sigma: 0
    noise_std: 0
  scale:
    rotation_deg: 0
    scale_min: 0.8
    scale_max: 1.25
    blur_sigma: 0
    noise_std: 0
